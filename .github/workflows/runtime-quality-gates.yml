name: Runtime quality gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-parity:
    name: Runtime parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flask pillow matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install peft transformers

      - name: Compile runtime surfaces
        run: |
          python -m py_compile \
            source/chat_app.py \
            source/chat_web_app.py \
            source/model_variants.py \
            source/multimodel_memory.py \
            source/route_policy_explorer.py \
            source/route_policy_protocol.py \
            source/route_policy_ledger.py \
            source/route_policy_lab.py \
            source/route_policy_shadow_registry.py \
            source/route_policy_study_cli.py \
            source/route_policy_protocol_cli.py \
            source/route_policy_shadow_cli.py \
            source/conversation_state.py \
            source/conversation_directive.py \
            source/mimomix_api.py \
            source/mimomix_controller.py \
            source/mimomix_core.py \
            source/mimomix_decoding.py \
            source/mimomix_distill.py \
            source/mimomix_observatory.py \
            source/mimomix_reasoner.py \
            source/mimomix_reasoner_web_app.py \
            source/reasoner_curriculum.py \
            source/reasoner_chat.py \
            source/benchmark_mimomix_reasoner.py \
            source/benchmark_reasoner_chat.py \
            source/run_v56_promotion_gate.py \
            source/mimomix_text.py \
            source/train_mimomix_talk.py \
            source/mimomix_talk_web_app.py \
            source/build_general_intelligence_curriculum.py \
            source/build_general_intelligence_repair_curriculum.py \
            source/qwen_adapter_promotion.py \
            source/qwen_paired_evidence.py \
            source/run_qwen_general_promotion_gate.py \
            source/generate_studio_runtime_manifest.py \
            source/multimodel_runtime.py \
            source/qwen_supermix_pipeline.py \
            source/supermix_multimodel_web_app.py \
            source/supermix_multimodel_desktop_app.py \
            runtime_python/chat_app.py \
            runtime_python/chat_web_app.py \
            runtime_python/model_variants.py

      - name: Check self-contained runtime snapshot
        run: python source/sync_runtime_model_variants.py --check

      - name: Check Studio distribution contract
        run: python source/generate_studio_runtime_manifest.py --check

      - name: Check for uncollectable test functions
        run: python source/dark_test_audit.py --check

      - name: Lint release-integrity surfaces
        run: |
          python -m ruff check \
            source/generate_studio_runtime_manifest.py \
            source/memory_authority.py \
            source/multimodel_memory.py \
            source/conversation_state.py \
            source/conversation_directive.py \
            source/grounding_runtime.py \
            source/multimodel_runtime.py \
            source/supermix_multimodel_web_app.py \
            source/supermix_multimodel_desktop_app.py \
            source/mimomix_reasoner.py \
            source/mimomix_reasoner_web_app.py \
            source/reasoner_curriculum.py \
            source/reasoner_chat.py \
            source/benchmark_mimomix_reasoner.py \
            source/benchmark_reasoner_chat.py \
            source/run_v56_promotion_gate.py \
            source/mimomix_text.py \
            source/train_mimomix_talk.py \
            source/mimomix_talk_web_app.py \
            runtime_python/memory_authority.py \
            runtime_python/conversation_state.py \
            runtime_python/grounding_runtime.py \
            test_memory_authority.py \
            test_multimodel_memory_tools.py \
            test_conversation_state.py \
            test_conversation_directive.py \
            test_multimodel_grounding_hook.py \
            test_qwen_grounding_runtime.py \
            test_supermix_multimodel_web_app.py \
            test_studio_runtime_manifest.py \
            test_mimomix_reasoner.py \
            test_mimomix_reasoner_web_app.py \
            test_v56_promotion_gate.py \
            test_reasoner_chat.py \
            test_mimomix_text.py \
            test_mimomix_talk_web_app.py

      - name: Run runtime and routing regression tests
        run: |
          python -m pytest -q test_runtime_model_variants_parity.py test_runtime_compute_controls.py test_model_variant_construction.py
          python -m pytest -q test_cognitive_leap_ultra_expert.py test_v51_materialize_demo.py
          python -m pytest -q test_route_policy_explorer.py test_route_policy_protocol.py test_route_policy_ledger.py test_route_policy_lab.py test_route_policy_shadow_registry.py test_route_policy_study_cli.py test_route_policy_protocol_cli.py test_route_policy_shadow_cli.py test_route_policy_shadow_web_status.py test_studio_runtime_manifest.py test_multimodel_memory_tools.py
          python -m pytest -q test_multimodel_runtime.py
          python -m pytest -q test_supermix_multimodel_web_app.py
          python -m pytest -q test_conversation_state.py test_conversation_style_memory.py test_conversation_directive.py test_qwen_conversation_routing.py test_multimodel_conversation_hook.py
          python -m pytest -q test_mimomix_core.py test_mimomix_decoding.py test_mimomix_distill.py test_mimomix_controller.py test_mimomix_observatory.py test_mimomix_api.py
          python -m pytest -q test_mimomix_reasoner.py test_mimomix_reasoner_web_app.py test_v56_promotion_gate.py test_reasoner_chat.py
          python -m pytest -q test_mimomix_text.py test_mimomix_talk_web_app.py
          python -m pytest -q test_mimomix_eval_splits.py test_mimomix_unseen_sentence_tokens.py test_v58_receipt_provenance.py test_mechanism_causality.py test_dark_test_audit.py
          python -m pytest -q test_v60_diverse_corpus.py test_reported_confidence_integrity.py test_compare_generalisation_runs.py test_v62_domain_corpus.py test_v63_training_state.py test_recall_index.py test_problem_solving_eval.py test_checkpoint_selection.py test_supermix_chat_server.py test_answer_check.py
          python -m pytest -q test_training_improvements.py

      - name: Freeze and smoke-test protocol console
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m pip install pyinstaller
          New-Item -ItemType Directory -Path build\ci_route_study -Force | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --console --name SupermixRouteStudy --paths source --distpath dist\ci_route_study --workpath build\ci_route_study\work --specpath build\ci_route_study source\route_policy_protocol_cli.py
          $payload = (& .\dist\ci_route_study\SupermixRouteStudy.exe --example --compact) | ConvertFrom-Json
          if ($payload.schema_version -ne 'route-study-protocol-preflight-v1') { throw 'Frozen protocol schema mismatch' }
          if ($payload.protocol.activation_available -ne $false) { throw 'Frozen protocol unexpectedly enables activation' }
          if ($payload.charter.randomness.assignment_performed -ne $false) { throw 'Frozen protocol unexpectedly assigns a route' }
          $bundlePath = Join-Path $PWD 'build\ci_route_study\review-bundle.json'
          & .\dist\ci_route_study\SupermixRouteStudy.exe --example-bundle --output $bundlePath
          if ($LASTEXITCODE -ne 0) { throw 'Frozen review-bundle build failed' }
          $bundle = Get-Content -LiteralPath $bundlePath -Raw | ConvertFrom-Json
          if ($bundle.schema_version -ne 'route-study-review-bundle-v1') { throw 'Frozen review-bundle schema mismatch' }
          if ($bundle.source_study_plans.Count -ne 2) { throw 'Frozen review bundle lost source strata' }
          $audit = (& .\dist\ci_route_study\SupermixRouteStudy.exe --audit-bundle $bundlePath --compact) | ConvertFrom-Json
          if ($audit.verification_level -ne 'full_source_bound_reconstruction') { throw 'Frozen review bundle did not fully reconstruct' }
          if ($audit.source_plan_reconstruction_performed -ne $true) { throw 'Frozen review bundle skipped source reconstruction' }
          if ($audit.activation_available -ne $false) { throw 'Frozen review bundle unexpectedly enables activation' }

          New-Item -ItemType Directory -Path build\ci_route_shadow -Force | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --console --name SupermixRouteShadow --paths source --distpath dist\ci_route_shadow --workpath build\ci_route_shadow\work --specpath build\ci_route_shadow source\route_policy_shadow_cli.py
          $registryPath = Join-Path $PWD 'build\ci_route_shadow\shadow.sqlite3'
          $seedPath = Join-Path $PWD 'build\ci_route_shadow\private-seed.json'
          $sealRaw = & .\dist\ci_route_shadow\SupermixRouteShadow.exe seal --registry $registryPath --bundle $bundlePath --seed-output $seedPath --compact
          if ($LASTEXITCODE -ne 0) { throw 'Frozen shadow campaign seal failed' }
          $seed = (Get-Content -LiteralPath $seedPath -Raw | ConvertFrom-Json).seed_material_base64url
          if ($sealRaw -match [regex]::Escape($seed)) { throw 'Frozen shadow seal leaked private seed material' }
          $seal = $sealRaw | ConvertFrom-Json
          if ($seal.execution_enabled -ne $false) { throw 'Frozen shadow seal unexpectedly enables execution' }
          $campaignId = $seal.public_package.campaign_seal.seal.campaign_id
          $clusterPath = Join-Path $PWD 'build\ci_route_shadow\cluster.json'
          $clusterIdentifier = python -c "from source.route_policy_ledger import hash_session_identity; print(hash_session_identity('ci-shadow-cluster-1'))"
          if ($LASTEXITCODE -ne 0) { throw 'CI shadow cluster hash generation failed' }
          @{ cluster_identifier = $clusterIdentifier } | ConvertTo-Json -Compress | Set-Content -LiteralPath $clusterPath -Encoding utf8
          $commitRaw = & .\dist\ci_route_shadow\SupermixRouteShadow.exe commit --registry $registryPath --campaign $campaignId --seed-input $seedPath --cluster-input $clusterPath --compact
          if ($LASTEXITCODE -ne 0) { throw 'Frozen shadow commitment failed' }
          $commit = $commitRaw | ConvertFrom-Json
          if ($commit.chosen_arm_revealed -ne $false) { throw 'Frozen shadow commitment revealed an arm early' }
          $closure = (& .\dist\ci_route_shadow\SupermixRouteShadow.exe close --registry $registryPath --campaign $campaignId --compact) | ConvertFrom-Json
          if ($closure.closure.frozen_commitment_count -ne 1) { throw 'Frozen shadow closure count mismatch' }
          $revealRaw = & .\dist\ci_route_shadow\SupermixRouteShadow.exe reveal --registry $registryPath --campaign $campaignId --seed-input $seedPath --compact
          if ($revealRaw -match [regex]::Escape($seed)) { throw 'Frozen shadow reveal CLI leaked seed material' }
          $reveal = $revealRaw | ConvertFrom-Json
          if ($reveal.seed_material_returned -ne $false) { throw 'Frozen shadow reveal returned seed material' }
          $verify = (& .\dist\ci_route_shadow\SupermixRouteShadow.exe verify --registry $registryPath --campaign $campaignId --compact) | ConvertFrom-Json
          if (($verify.complete -ne $true) -or ($verify.matched -ne 1) -or ($verify.mismatched -ne 0)) { throw 'Frozen shadow assignment reconstruction failed' }
          $registryHashBeforeStatus = (Get-FileHash -LiteralPath $registryPath -Algorithm SHA256).Hash
          $status = (& .\dist\ci_route_shadow\SupermixRouteShadow.exe status --registry $registryPath --campaign $campaignId --compact) | ConvertFrom-Json
          if ($status.campaigns[0].state -ne 'reveal_verification_complete') { throw 'Frozen shadow registry state mismatch' }
          if ($status.read_only -ne $true) { throw 'Frozen shadow registry status is not explicitly read-only' }
          if ($status.activation_available -ne $false) { throw 'Frozen shadow registry unexpectedly enables activation' }
          $registryHashAfterStatus = (Get-FileHash -LiteralPath $registryPath -Algorithm SHA256).Hash
          if ($registryHashAfterStatus -ne $registryHashBeforeStatus) { throw 'Frozen shadow status mutated durable registry bytes' }
